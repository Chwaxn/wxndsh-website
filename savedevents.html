<script type="text/javascript">

            document.documentElement.scrollTop > 400
        ){

                "ShowBackToTop"
            );


        }else{


            backToTop.classList.remove(
                "ShowBackToTop"
            );


        }


    });



    backToTop.onclick = function(){


        window.scrollTo({

            top:0,

            behavior:"smooth"

        });


    };

    ======================================== */

/* ========================================
   SAVED EVENTS
======================================== */

var savedEventList =
    document.getElementById("SavedEventList");

var noSavedEventsMessage =
    document.getElementById("NoSavedEventsMessage");


var savedEvents =
    JSON.parse(
        localStorage.getItem("wxndshSavedEvents")
    ) || [];



/* ========================================
   CREATE SAVED EVENT CARD
======================================== */

function createSavedEventCard(savedEvent){


    var savedEventCard =
        document.createElement("div");


    savedEventCard.className =
        "EventCard SavedEventCard";


    savedEventCard.setAttribute(
        "data-event-id",
        savedEvent.id
    );


    savedEventCard.setAttribute(
        "data-category",
        savedEvent.category
    );


    savedEventCard.innerHTML =

        '<img' +

            ' class="' +
            savedEvent.imageClass +
            '"' +

            ' src="' +
            savedEvent.image +
            '"' +

            ' alt="' +
            savedEvent.imageAlt +
            '"' +

        '>' +


        '<div class="EventContent">' +


            '<p class="' +
            savedEvent.categoryClass +
            '">' +

                savedEvent.categoryText +

            '</p>' +


            '<button' +

                ' type="button"' +

                ' class="RemoveSavedIcon"' +

                ' aria-label="Remove saved event"' +

                ' title="Remove from saved events"' +

            '>' +

                '<i class="fa-solid fa-trash-can"></i>' +

            '</button>' +


            '<h2>' +

                savedEvent.title +

            '</h2>' +


            '<h3>' +

                savedEvent.location +

            '</h3>' +


            '<p class="EventInfo">' +

                '<i class="fa-solid fa-calendar-days"></i>' +

                savedEvent.date +

            '</p>' +


            '<p class="EventInfo">' +

                '<i class="fa-regular fa-clock"></i>' +

                savedEvent.time +

            '</p>' +


'<div class="MoreButton">' +

    '<a' +

        ' href="more.html?id=' +
        savedEvent.id +
        '"' +

        ' class="MoreText"' +

    '>' +

        'MORE' +

    '</a>' +

'</div>' +


            '<div class="Clear"></div>' +


        '</div>';


    savedEventList.appendChild(
        savedEventCard
    );


}



/* ========================================
   DISPLAY SAVED EVENTS
======================================== */

function displaySavedEvents(){


    savedEventList.innerHTML =
        "";


    if(savedEvents.length == 0){


        savedEventList.style.display =
            "none";


        noSavedEventsMessage.style.display =
            "block";


        return;


    }


    savedEventList.style.display =
        "grid";


    noSavedEventsMessage.style.display =
        "none";


    for(var i = 0; i < savedEvents.length; i++){


        createSavedEventCard(
            savedEvents[i]
        );


    }


}



/* ========================================
   REMOVE SAVED EVENT
======================================== */

savedEventList.onclick = function(event){


    var removeButton =
        event.target.closest(
            ".RemoveSavedIcon"
        );


    if(removeButton == null){


        return;


    }


    var selectedCard =
        removeButton.closest(
            ".SavedEventCard"
        );


    var selectedEventId =
        selectedCard.getAttribute(
            "data-event-id"
        );


    selectedCard.classList.add(
        "RemoveSavedCard"
    );


    setTimeout(function(){


        for(var i = 0; i < savedEvents.length; i++){


            if(savedEvents[i].id == selectedEventId){


                savedEvents.splice(
                    i,
                    1
                );


                break;


            }


        }


        localStorage.setItem(

            "wxndshSavedEvents",

            JSON.stringify(savedEvents)

        );


        displaySavedEvents();


    }, 350);


};



/* ========================================
   DISPLAY SAVED EVENTS WHEN PAGE LOADS
======================================== */

displaySavedEvents();

</script>
